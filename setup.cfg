# flake8 does not read pyproject.toml, so its config lives here.
[flake8]
max-line-length = 100
max-complexity = 10
exclude =
    .git,
    .venv,
    .vs,
    __pycache__,
    Log,
    migrations/versions
# E203/W503 conflict with common formatting of slices and line breaks before binary operators.
extend-ignore = E203, W503
per-file-ignores =
    __init__.py:F401
